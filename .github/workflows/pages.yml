name: Deploy Jasmine 2.0 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Validate static site
        shell: bash
        run: |
          set -euo pipefail
          test -s web/index.html
          test -s web/styles.css
          test -s web/app.js
          grep -q '<title>Jasmine 2.0' web/index.html
          grep -q 'id="top"' web/index.html
          grep -q 'id="thesis"' web/index.html
          test "$(grep -c '<section' web/index.html)" -ge 10
          test "$(grep -c 'href="#' web/index.html)" -ge 10

      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -r web/. _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/styles.css
          test -s _site/app.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
